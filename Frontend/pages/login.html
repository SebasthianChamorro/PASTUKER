<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#1a4a2e">
    <title>Pastuker — Iniciar Sesión</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/dialogos.css">
</head>
<body>

    <!-- ESCENA DE FONDO -->
    <div class="escena" aria-hidden="true">
        <div class="cielo"></div>
        <img src="../images/landscale/sun.png" alt="" class="sol-img">
        <img src="../images/landscale/clouds.png"   alt="" class="nube-img nube-i1">
        <img src="../images/landscale/clouds_2.png" alt="" class="nube-img nube-i2">
        <img src="../images/landscale/cloud_3.png"  alt="" class="nube-img nube-i3">
        <img src="../images/landscale/clouds.png"   alt="" class="nube-img nube-i4">
        <img src="../images/landscale/birds.png" alt="" class="aves aves-1">
        <img src="../images/landscale/birds.png" alt="" class="aves aves-2">
        <div class="montanas-fondo">
            <img src="../images/landscale/mountain.png" class="montana-img mt-1" alt="">
            <img src="../images/landscale/mountain.png" class="montana-img mt-2" alt="">
            <img src="../images/landscale/mountain.png" class="montana-img mt-3" alt="">
            <img src="../images/landscale/mountain.png" class="montana-img mt-4" alt="">
            <img src="../images/landscale/mountain.png" class="montana-img mt-5" alt="">
            <img src="../images/landscale/mountain.png" class="montana-img mt-6" alt="">
        </div>
        <div class="capa-fondo">
            <img src="../images/landscale/tree_2.png" class="arbol-fondo af-1" alt="">
            <img src="../images/landscale/tree.png"   class="arbol-fondo af-2" alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-fondo af-3" alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-fondo af-4" alt="">
            <img src="../images/landscale/tree.png"   class="arbol-fondo af-5" alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-fondo af-6" alt="">
            <img src="../images/landscale/tree.png"   class="arbol-fondo af-7" alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-fondo af-8" alt="">
        </div>
        <div class="capa-media">
            <img src="../images/landscale/tree_3.png" class="arbol-medio am-1" alt="">
            <img src="../images/landscale/tree.png"   class="arbol-medio am-2" alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-medio am-3" alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-medio am-4" alt="">
            <img src="../images/landscale/tree.png"   class="arbol-medio am-5" alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-medio am-6" alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-medio am-7" alt="">
            <img src="../images/landscale/tree.png"   class="arbol-medio am-8" alt="">
        </div>
        <div class="capa-frente">
            <img src="../images/landscale/tree_3.png" class="arbol-frente af-f1"  alt="">
            <img src="../images/landscale/tree.png"   class="arbol-frente af-f2"  alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-frente af-f3"  alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-frente af-f4"  alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-frente af-f6"  alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-frente af-f7"  alt="">
            <img src="../images/landscale/tree.png"   class="arbol-frente af-f8"  alt="">
            <img src="../images/landscale/tree_2.png" class="arbol-frente af-f9"  alt="">
            <img src="../images/landscale/tree_3.png" class="arbol-frente af-f10" alt="">
        </div>
        <div class="capa-arbustos">
            <img src="../images/landscale/bush.png"   class="arbusto ab-1"  alt="">
            <img src="../images/landscale/bush_2.png" class="arbusto ab-2"  alt="">
            <img src="../images/landscale/bush.png"   class="arbusto ab-3"  alt="">
            <img src="../images/landscale/bush_2.png" class="arbusto ab-4"  alt="">
            <img src="../images/landscale/bush_2.png" class="arbusto ab-7"  alt="">
            <img src="../images/landscale/bush.png"   class="arbusto ab-8"  alt="">
            <img src="../images/landscale/bush_2.png" class="arbusto ab-9"  alt="">
            <img src="../images/landscale/bush.png"   class="arbusto ab-10" alt="">
        </div>
        <div class="suelo-hierba"></div>
        <div class="suelo-tierra"></div>
        <div class="particulas">
            <div class="particula p-1"></div>
            <div class="particula p-2"></div>
            <div class="particula p-3"></div>
            <div class="particula p-4"></div>
            <div class="particula p-5"></div>
            <div class="particula p-6"></div>
        </div>
    </div>

    <main class="contenido-principal">
        <div class="login-card" id="loginCard">

            <div class="login-header">
                <h1 class="login-titulo">Bienvenido</h1>
                <p class="login-subtitulo">Ingresa tus datos para continuar</p>
                <div class="deco-linea">
                    <span class="linea-deco"></span>
                    <span class="icono-deco">✦</span>
                    <span class="linea-deco"></span>
                </div>

                <!-- Mama Rosa — burbuja manejada por dialogos.js -->
                <div class="mama-en-card">

                    <!-- Botón regresar — dentro del contenedor de mama -->
                    <a href="#" id="btnRegresar" class="btn-regresar" aria-label="Volver">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M19 12H5M5 12l7-7M5 12l7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>

                    <div class="mama-dos-frames">
                        <img src="../images/mama/mama_frame1.png" class="mama-frame mama-f1" alt="Mama Rosa">
                        <img src="../images/mama/mama_frame2.png" class="mama-frame mama-f2" alt="">
                    </div>
                    <p class="mama-nombre">Mama Rosa</p>
                    <p class="mama-titulo-npc">Sabia Ancestral · Guardiana de Rituales</p>
                </div>
            </div>

            <form class="login-form" id="loginForm" novalidate>

                <div class="campo-grupo">
                    <label class="campo-label" for="telefono">
                        <svg class="label-icono" viewBox="0 0 24 24" fill="none">
                            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" fill="currentColor"/>
                        </svg>
                        Teléfono
                    </label>
                    <div class="input-wrapper">
                        <input type="tel" id="telefono" name="telefono" class="campo-input"
                            placeholder="Ejemplo: 3001234567" maxlength="10" autocomplete="tel" required>
                    </div>
                    <span class="campo-error" id="errorTelefono"></span>
                </div>

                <div class="campo-grupo">
                    <label class="campo-label" for="contrasena">
                        <svg class="label-icono" viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
                        </svg>
                        Contraseña
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="contrasena" name="contrasena" class="campo-input"
                            placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                        <button type="button" class="btn-ojo" id="btnOjo" aria-label="Mostrar contraseña">
                            <svg class="ojo-abierto" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            <svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <span class="campo-error" id="errorContrasena"></span>
                </div>

                <div class="fila-opciones">
                    <label class="check-label">
                        <input type="checkbox" id="recordarme" class="check-input">
                        <span class="check-custom"></span>
                        <span class="check-texto">Recordarme</span>
                    </label>
                    <a href="recuperar.html" class="link-recuperar">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-login-texto">Iniciar Sesión</span>
                    <span class="btn-spinner" id="loginSpinner" style="display:none">⟳</span>
                </button>

                <div class="login-error" id="loginError" style="display:none">
                    <span class="error-icono">⚠</span>
                    <span id="loginErrorMsg">Teléfono o contraseña incorrectos</span>
                </div>
            </form>

            <p class="link-registro">
                ¿No tienes cuenta?
                <a href="register.html" class="link-registro-enlace">Regístrate aquí</a>
            </p>

            <div class="separador-o">
                <span class="sep-linea"></span>
                <span class="sep-texto">o</span>
                <span class="sep-linea"></span>
            </div>

            <a href="game.html" class="btn-invitado">
                <span>▶</span> Jugar como Invitado
            </a>

        </div>
    </main>

    <script src="../js/login.js"></script>
    <script src="../js/dialogos.js"></script>
    <script>
        // ── Botón regresar — siempre vuelve al index ──
        document.getElementById('btnRegresar').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = '../index.html';
        });

        // ── Diálogo de bienvenida ──
        window.addEventListener('load', () => {
            DialogoSistema.mostrarConDelay('login_bienvenida', 1000);
        });

        // ── Reinicia animaciones al volver con el botón atrás del navegador ──
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                document.querySelectorAll('.mama-frame').forEach(el => {
                    el.style.animation = 'none';
                    el.offsetHeight;
                    el.style.animation = '';
                });
            }
        });
    </script>
</body>
</html>
