<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pastuker — Mundo 2: Selva Profunda</title>
  <link rel="stylesheet" href="../css/game.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* ── Resets de página ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a4a2e;
    }

    /* ── Contenedor del canvas Phaser ── */
    #game-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    #game-wrap canvas { display: block; }

    /* ══════════════════════════════════════════
       PANEL PLANTA
    ══════════════════════════════════════════ */
    #panel {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s;
    }
    #panel.on { opacity: 1; pointer-events: all; }

    .pp-box {
      width: min(92vw, 440px);
      max-height: 88vh;
      overflow-y: auto;
      background: linear-gradient(160deg, #0c2316 0%, #1a4a2e 100%);
      border: 2px solid #2d6b4a;
      border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(212,175,55,.18);
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 3vw, 24px);
      gap: clamp(8px, 2vw, 14px);
    }

    /* imagen grande */
    .pp-img-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #2d6b4a;
    }
    .pp-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* barra de progreso */
    .pp-bar { width:100%; background:rgba(255,255,255,.1); border-radius:4px; height:6px; }
    .pp-bar-fill { height:100%; border-radius:4px;
                   background:linear-gradient(90deg,#2d6b4a,#d4af37);
                   transition:width .6s; }

    /* textos */
    .pp-nombre {
      font-family:'Press Start 2P', monospace;
      font-size: clamp(10px,2.2vw,15px);
      color: #d4af37;
      line-height: 1.4;
    }
    .pp-ci {
      font-family:'Press Start 2P', monospace;
      font-size: clamp(7px,1.5vw,10px);
      color: rgba(212,175,55,.6);
      font-style: italic;
    }
    .pp-label {
      font-family:'Press Start 2P', monospace;
      font-size: clamp(7px,1.5vw,9px);
      color: #7dbf8a;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-top: 4px;
    }
    .pp-val {
      font-family: sans-serif;
      font-size: clamp(11px,2vw,14px);
      color: rgba(255,255,255,.85);
      line-height: 1.55;
    }

    /* botón continuar */
    .btn-cont {
      margin-top: auto;
      padding: clamp(9px,2vw,13px) 0;
      background: linear-gradient(135deg,#2d6b4a,#1a4a2e);
      border: 1.5px solid #d4af37;
      border-radius: 8px;
      color: #d4af37;
      font-family:'Press Start 2P', monospace;
      font-size: clamp(8px,1.8vw,11px);
      cursor: pointer;
      text-align: center;
      transition: background .2s;
    }
    .btn-cont:hover { background: #2d6b4a; }

    /* ══════════════════════════════════════════
       OVERLAY QUIZ
    ══════════════════════════════════════════ */
    #quiz-ov {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,.88);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    #quiz-ov.on { opacity: 1; pointer-events: all; }

    .quiz-box {
      width: min(92vw, 500px);
      background: linear-gradient(160deg,#0c2316,#1a4a2e);
      border: 2px solid #2d6b4a;
      border-radius: 14px;
      padding: clamp(16px,3vw,26px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .qhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .qp {
      font-family:'Press Start 2P', monospace;
      font-size: clamp(7px,1.5vw,9px);
      color: rgba(212,175,55,.7);
    }
    .qtim {
      font-family:'Press Start 2P', monospace;
      font-size: clamp(11px,2.2vw,15px);
      color: #7dbf8a;
      min-width: 28px;
      text-align: right;
    }
    .qtim.r { color: #ff7070; }

    /* barra de tiempo */
    .qbar  { width:100%; background:rgba(255,255,255,.1); border-radius:4px; height:5px; }
    .qbf   { height:100%; border-radius:4px; background:#d4af37; width:100%;
             transition:width 1s linear; }

    .qpreg {
      font-family: sans-serif;
      font-size: clamp(12px,2.2vw,15px);
      color: #fff;
      line-height: 1.55;
    }
    .qopts { display:flex; flex-direction:column; gap:9px; }
    .qopt {
      padding: clamp(8px,1.8vw,12px) clamp(10px,2vw,16px);
      background: rgba(45,107,74,.3);
      border: 1.5px solid #2d6b4a;
      border-radius: 8px;
      color: rgba(255,255,255,.85);
      font-family: sans-serif;
      font-size: clamp(11px,2vw,14px);
      text-align: left;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .qopt:hover:not(:disabled) { background:rgba(45,107,74,.65); border-color:#7dbf8a; }
    .qopt.ok  { background:rgba(45,107,74,.75); border-color:#7dbf8a; color:#fff; }
    .qopt.mal { background:rgba(180,50,50,.55); border-color:#ff7070; color:#fff; }
    .qopt:disabled { cursor:default; }

    /* ══════════════════════════════════════════
       OVERLAY RESULTADO
    ══════════════════════════════════════════ */
    #res-ov {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0,0,0,.90);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    #res-ov.on { opacity:1; pointer-events:all; }

    .res-box {
      width: min(88vw,400px);
      background: linear-gradient(160deg,#0c2316,#1a4a2e);
      border: 2px solid #2d6b4a;
      border-radius: 14px;
      padding: clamp(18px,3.5vw,30px);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .re { font-size:clamp(36px,8vw,52px); }
    .rt {
      font-family:'Press Start 2P', monospace;
      font-size:clamp(10px,2.2vw,14px);
      color:#d4af37;
    }
    .rp {
      font-family:'Press Start 2P', monospace;
      font-size:clamp(13px,2.8vw,18px);
      color:#7dbf8a;
    }
    .rd {
      font-family:sans-serif;
      font-size:clamp(11px,2vw,14px);
      color:rgba(255,255,255,.7);
    }
    .res-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .rbr, .rbm {
      padding:clamp(9px,2vw,13px) clamp(16px,3vw,24px);
      border-radius:8px;
      font-family:'Press Start 2P', monospace;
      font-size:clamp(7px,1.6vw,10px);
      cursor:pointer;
      border:1.5px solid;
      transition:background .18s;
    }
    .rbr { background:rgba(45,107,74,.6); border-color:#7dbf8a; color:#d4af37; }
    .rbr:hover { background:#2d6b4a; }
    .rbm { background:rgba(0,0,0,.4); border-color:#555; color:rgba(255,255,255,.65); }
    .rbm:hover { background:rgba(255,255,255,.08); }

    /* ══════════════════════════════════════════
       CONTROLES TÁCTILES
       Izquierda: botones ◀ ▶
       Derecha:   botones ▲ (salto) y ▼ (agacharse)
    ══════════════════════════════════════════ */

    /* Contenedor izquierdo: ◀ ▶ en fila */
    #dpad-lr {
      position: fixed;
      left: clamp(10px,3vw,24px);
      bottom: clamp(18px,5vw,36px);
      z-index: 150;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    /* Contenedor derecho: ▲ y ▼ en columna */
    #dpad-ud {
      position: fixed;
      right: clamp(10px,3vw,24px);
      bottom: clamp(18px,5vw,36px);
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dp-btn {
      width:  clamp(52px,12vw,68px);
      height: clamp(52px,12vw,68px);
      border-radius: 10px;
      background: rgba(45,107,74,.72);
      border: 2px solid rgba(212,175,55,.5);
      color: #d4af37;
      font-size: clamp(18px,4vw,26px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background .1s;
    }
    .dp-btn:active         { background: rgba(45,107,74,1); }
    .dp-btn.dp-jump        { border-color: rgba(212,175,55,.85); }
    .dp-btn.dp-jump:active { background: rgba(70,140,100,1); }

    /* Ocultar en desktop */
    @media (pointer:fine) {
      #dpad-lr, #dpad-ud { display:none; }
    }
  </style>
</head>
<body>

  <!-- ── Canvas Phaser ── -->
  <div id="game-wrap"></div>

  <!-- ══════════════════════════
       PANEL PLANTA
  ══════════════════════════ -->
  <div id="panel">
    <div class="pp-box">
      <div id="pp-ico"></div>

      <div class="pp-bar">
        <div class="pp-bar-fill" id="pp-pfill" style="width:0%"></div>
      </div>
      <div class="pp-label" id="pp-ptxt">Planta encontrada</div>

      <div class="pp-nombre" id="pp-nom">—</div>
      <div class="pp-ci"     id="pp-ci" ></div>

      <div class="pp-label">Descripción</div>
      <div class="pp-val"   id="pp-desc">—</div>

      <div class="pp-label">Usos medicinales</div>
      <div class="pp-val"   id="pp-usos">—</div>

      <div class="pp-label">Preparación</div>
      <div class="pp-val"   id="pp-prep">—</div>

      <button class="btn-cont">Responder preguntas →</button>
    </div>
  </div>

  <!-- ══════════════════════════
       OVERLAY QUIZ
  ══════════════════════════ -->
  <div id="quiz-ov">
    <div class="quiz-box">
      <div class="qhead">
        <span class="qp">Pregunta 1/3</span>
        <span class="qtim">20</span>
      </div>
      <div class="qbar"><div class="qbf"></div></div>
      <div class="qpreg">¿Cargando pregunta?</div>
      <div class="qopts">
        <button class="qopt">Opción A</button>
        <button class="qopt">Opción B</button>
        <button class="qopt">Opción C</button>
        <button class="qopt">Opción D</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════
       OVERLAY RESULTADO
  ══════════════════════════ -->
  <div id="res-ov">
    <div class="res-box">
      <div class="re">🌿</div>
      <div class="rt">¡Excelente!</div>
      <div class="rp">+100 XP</div>
      <div class="rd">3 de 3 correctas</div>
      <div class="res-btns">
        <button class="rbr">Sig. Nivel ›</button>
        <button class="rbm">← Menú</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════
       D-PAD  (táctil)
  ══════════════════════════ -->
  <!-- ══ CONTROLES IZQUIERDA: ◀ ▶ ══ -->
  <div id="dpad-lr">
    <div id="dp-left"  class="dp-btn">◀</div>
    <div id="dp-right" class="dp-btn">▶</div>
  </div>

  <!-- ══ CONTROLES DERECHA: ▲ salto / ▼ agacharse ══ -->
  <div id="dpad-ud">
    <div id="dp-up"   class="dp-btn dp-jump">▲</div>
    <div id="dp-down" class="dp-btn">▼</div>
  </div>

  <!-- ══════════════════════════
       SCRIPTS
  ══════════════════════════ -->
  <!-- Catálogo de plantas compartido -->
  <script src="../js/plantas_catalogo.js"></script>
  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <!-- Lógica del juego -->
  <script src="../js/game-2.js"></script>

</body>
</html>
