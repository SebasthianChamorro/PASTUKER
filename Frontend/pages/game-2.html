<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="screen-orientation" content="landscape">
  <title>Pastuker — Mundo 2: Selva Profunda</title>
  <link rel="stylesheet" href="../css/game.css">
  <link rel="stylesheet" href="../css/game-2.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── Canvas Phaser ── -->
  <div id="game-wrap"></div>

  <!-- ── Panel Planta ── -->
  <div id="panel">
    <div class="pp-box">
      <div id="pp-ico"></div>
      <div class="pp-bar"><div class="pp-bar-fill" id="pp-pfill" style="width:0%"></div></div>
      <div class="pp-label" id="pp-ptxt">Planta encontrada</div>
      <div class="pp-nombre" id="pp-nom">—</div>
      <div class="pp-ci"     id="pp-ci"></div>
      <div class="pp-label">Descripción</div>
      <div class="pp-val"   id="pp-desc">—</div>
      <div class="pp-label">Usos medicinales</div>
      <div class="pp-val"   id="pp-usos">—</div>
      <div class="pp-label">Preparación</div>
      <div class="pp-val"   id="pp-prep">—</div>
      <button class="btn-cont">Responder pregunta →</button>
    </div>
  </div>

  <!-- ── Quiz Overlay ── -->
  <div id="quiz-ov">
    <div class="quiz-box">
      <div class="qhead">
        <span class="qp">Pregunta 1/3</span>
        <span class="qtim">20</span>
      </div>
      <div class="qbar"><div class="qbf"></div></div>
      <div class="qpreg">¿Cargando pregunta?</div>
      <div class="qopts">
        <button class="qopt">Opción A</button>
        <button class="qopt">Opción B</button>
        <button class="qopt">Opción C</button>
        <button class="qopt">Opción D</button>
      </div>
    </div>
  </div>

  <!-- ── Pausa ── -->
  <div id="pause-ov">
    <div class="pause-box">
      <p class="pause-titulo">⏸ Juego Pausado</p>
      <div class="pause-vol">
        <label>Volumen</label>
        <div class="pause-vol-row">
          <input type="range" min="0" max="100" value="50"
                 oninput="cambiarVolumen(this.value)">
          <span id="volValor">50%</span>
        </div>
      </div>
      <button class="pause-btn pb-reanudar" onclick="reanudarJuego()">▶ Reanudar</button>
      <button class="pause-btn pb-salir"    onclick="salirAlMenu()">← Salir al Menú</button>
    </div>
  </div>

  <!-- ── Resultado ── -->
  <div id="res-ov">
    <div class="res-box">
      <div class="re">🌿</div>
      <div class="rt">¡Excelente!</div>
      <div class="rp">+100 XP</div>
      <div class="rd">3 de 3 correctas</div>
      <div class="res-btns">
        <button class="rbr">Sig. Nivel ›</button>
        <button class="rbm">← Menú</button>
      </div>
    </div>
  </div>

  <!-- ── D-Pad táctil ── -->
  <div id="dpad-lr">
    <div id="dp-left"  class="dp-btn">◀</div>
    <div id="dp-right" class="dp-btn">▶</div>
  </div>
  <div id="dpad-ud">
    <div id="dp-up"   class="dp-btn dp-jump">▲</div>
    <div id="dp-down" class="dp-btn">▼</div>
  </div>

  <!-- ══ SCRIPTS ══
       ⚠️ Orden obligatorio:
       1. plantas_catalogo.js — define window.PLANTAS_CATALOGO
       2. phaser.min.js       — motor de juego (LOCAL para funcionar offline)
       3. game-2.js           — usa PLANTAS_CATALOGO y Phaser
  ══ -->
  <script src="../js/plantas_catalogo.js"></script>
  <script src="../js/phaser.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/game-2.js"></script>

  <script>
  // Forzar landscape al cargar
  (function() {
      // Método 1: screen.orientation API
      if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape-primary').catch(() => {});
      }
      // Método 2: webkit
      if (screen.lockOrientation) screen.lockOrientation('landscape');
      if (screen.mozLockOrientation) screen.mozLockOrientation('landscape');
      if (screen.msLockOrientation) screen.msLockOrientation('landscape');
      
      // Método 3: Rotar con CSS si está en portrait
      function checkOrientation() {
          if (window.innerHeight > window.innerWidth) {
              document.body.style.transform = 'rotate(90deg)';
              document.body.style.transformOrigin = 'left top';
              document.body.style.width = window.innerHeight + 'px';
              document.body.style.height = window.innerWidth + 'px';
              document.body.style.position = 'absolute';
              document.body.style.top = '0';
              document.body.style.left = window.innerWidth + 'px';
          } else {
              document.body.style.transform = '';
              document.body.style.width = '';
              document.body.style.height = '';
              document.body.style.position = '';
              document.body.style.top = '';
              document.body.style.left = '';
          }
      }
      
      checkOrientation();
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
  })();
  </script>

</body>
</html>
